# Tutorial 08: backend (NestJS + SQLite) and frontend (nginx) on one VM.
# Replace the IP in CORS_ORIGIN with the VM's external IP, and build the
# frontend with VITE_API_BASE_URL=http://<VM IP>:3000 before deploying.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SQLITE_PATH: /data/database.sqlite
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "http://YOUR_VM_IP,http://127.0.0.1:8080,http://localhost,http://127.0.0.1,http://localhost:5173"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
