name: CI

# Runs once per PR (against the merge result with main). There is no push
# trigger: main only changes through merged PRs, which already passed CI.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # check:lint runs OXLint + ESLint without --fix, so CI fails instead of
      # silently rewriting files that would never be committed.
      - name: Lint
        run: npm run check:lint

      - name: Unit tests
        run: npm run test:unit

      - name: Type-check + Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    needs: [build-test, backend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Both Dockerfiles are multi-stage: they install, build and keep only the
      # output, the same way the VM builds them with deploy.sh.
      - name: Build images
        run: |
          docker image build -t finzen-backend:ci backend
          docker image build -t finzen-frontend:ci frontend

      - name: Run frontend container and check routes
        run: |
          docker container run -d --name finzen-ci -p 8080:80 finzen-frontend:ci
          sleep 3
          home_page="$(curl -fsS http://localhost:8080/)"
          grep -q '<div id="app">' <<< "$home_page"
          # Client-side routes must fall back to index.html.
          curl -fsS -o /dev/null http://localhost:8080/transactions
          docker container rm -f finzen-ci
